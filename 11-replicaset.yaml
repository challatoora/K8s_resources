apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    tier: frontend
spec:
  # modify replicas according to your case
  replicas: 2
  selector:
    matchLabels:
      tier: DB
      env: QUA
  template:
    metadata:
      tier: DB
      env: QUA
    spec:
      containers:
      - name: nginx
        image: nginx