apiVersion: apps/v1
kind: Deployment
metadata:
  name: deplomet-demo
  labels:
    tier: database
spec:
  # modify replicas according to your case
  replicas: 4
  selector:
    matchLabels:
      tier: DB
      env: QUA
  template:
    metadata:
      labels: 
        tier: DB
        env: QUA
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2