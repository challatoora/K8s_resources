apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi # Must match or be less than the actual EBS volume size
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-082ba7d29d46ed1f6 # Replace with your actual AWS EBS Volume ID
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: ebs-static-pv # Direct binding to the PV above
  resources:
    requests:
      storage: 4Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pod
spec:
  containers:
    - name: nginx
      image: nginx:latest
      volumeMounts:
        - name: ebs-storage
          mountPath: /usr/share/nginx/html # Path inside the container where the volume will be accessible
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1c
  volumes:
    - name: ebs-storage
      persistentVolumeClaim:
        claimName: ebs-static-pvc
